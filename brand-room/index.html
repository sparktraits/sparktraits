<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Brand guide · Spark Traits</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
:root{--bg:#FFF8F1;--surface:#fff;--ink:#1E130E;--muted:#7A6457;--line:#EEDCCC;--line-strong:#9E8573;--ember:#E04E14;--deep:#C2410C;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Helvetica Neue",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--deep)}
.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top .in{max-width:1080px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px max(20px,env(safe-area-inset-left,0px))}
.brand{font-size:20px;letter-spacing:-.03em;text-decoration:none;color:var(--ink)}
.brand b{font-weight:800}
.tabs{display:flex;gap:6px}
.tabs a{padding:8px 14px;border-radius:999px;text-decoration:none;color:var(--ink);font-size:14px;border:1px solid transparent}
.tabs a.on{border-color:var(--ink)}
main{max-width:1080px;margin:0 auto;padding:40px max(20px,env(safe-area-inset-left,0px)) 80px}
.gate{max-width:420px;margin:12vh auto;text-align:left}
.gate h1{font-size:40px;letter-spacing:-.04em;line-height:1.05;margin:0 0 10px}
.gate p{color:var(--muted);margin:0 0 22px}
.gate form{display:flex;gap:8px}
.gate input{flex:1;min-width:0;font:inherit;padding:12px 16px;border:1px solid var(--line-strong);border-radius:999px;background:var(--surface)}
.gate button,.dl{font:inherit;font-weight:700;border:0;border-radius:999px;padding:12px 20px;background:var(--deep);color:#fff;cursor:pointer}
.gate .err{color:var(--deep);min-height:1.5em;margin-top:10px}
:focus-visible{outline:2px solid var(--ember);outline-offset:3px}
.ph{padding-bottom:28px;border-bottom:1px solid var(--line);margin-bottom:8px}
.eye{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
h1{font-size:clamp(38px,6vw,64px);line-height:1;letter-spacing:-.045em;margin:0 0 18px;text-wrap:balance}
h1 em,h2 em{color:var(--ember);font-style:italic}
h2{font-size:32px;letter-spacing:-.03em;line-height:1.1;margin:56px 0 14px;text-wrap:balance}
h3{font-size:20px;letter-spacing:-.02em;margin:32px 0 8px}
p,li{max-width:70ch}
.lede p{font-size:19px;color:var(--ink)}
.toc{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}
.toc a{font-size:14px;text-decoration:none;color:var(--ink);border:1px solid var(--line-strong);border-radius:999px;padding:6px 12px}
section{scroll-margin-top:80px}
table{border-collapse:collapse;width:100%;margin:14px 0;font-size:15px;display:block;overflow-x:auto}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
code{font-family:ui-monospace,Menlo,monospace;font-size:.9em;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:1px 6px}
blockquote{margin:14px 0;padding:14px 20px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--ember);border-radius:10px}
blockquote p{margin:6px 0}
.logos{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;margin-top:20px}
.lg{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px}
.lgbox{height:130px;display:flex;align-items:center;justify-content:center;border-radius:12px;background:var(--bg);padding:24px}
.lgbox svg{max-height:70px;max-width:100%;width:auto;height:auto}
.lgbox.small svg{max-height:64px}
.lgbox.ink{background:var(--ink)}
.lg p{font-size:14px;color:var(--muted);margin:12px 0}
.dl{font-size:13px;padding:8px 14px}
.sws{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;margin-top:18px}
.sw{display:flex;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.sw .chip{flex:none;width:56px;height:56px;border-radius:12px;border:1px solid var(--line)}
.sw p{font-size:13px;color:var(--muted);margin:4px 0 0}
.tys{margin-top:18px;border-top:1px solid var(--line)}
.ty{display:grid;grid-template-columns:240px minmax(0,1fr);gap:24px;padding:20px 0;border-bottom:1px solid var(--line);align-items:center}
.tymeta span{display:block;font-size:13px;color:var(--muted)}
.tymeta p{font-size:13px;color:var(--muted);margin:6px 0 0}
.tysample{min-width:0;overflow-wrap:anywhere}
.shapewrap{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:32px;align-items:start}
.shapeimg svg{width:100%;height:auto}
.cap{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);text-align:center}
.foot{max-width:1080px;margin:0 auto;padding:24px max(20px,env(safe-area-inset-left,0px)) 48px;color:var(--muted);font-size:13px;border-top:1px solid var(--line)}
@media (max-width:720px){.ty,.shapewrap{grid-template-columns:minmax(0,1fr)}.ty{gap:8px}h2{font-size:26px}.tysample{font-size:min(var(--fs,100%),11vw)}}
</style>
</head>

const $=id=>document.getElementById(id);
const here=location.pathname.endsWith("voice.html")?"tVoice":"tGuide";
function b64(s){return Uint8Array.from(atob(s),c=>c.charCodeAt(0));}
async function open(pass){
  const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pass),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(DATA.s),iterations:DATA.n,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(DATA.i)},key,b64(DATA.c));
  const ds=new Blob([pt]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
  return await new Response(ds).text();
}
function show(){
  $("gate").hidden=true; $("content").hidden=false; $("tabs").hidden=false; $("foot").hidden=false; $(here).classList.add("on");
  { document.querySelectorAll(".dl").forEach(b=>b.addEventListener("click",()=>{ const n=b.dataset.name; const svg=b.closest(".lg").querySelector("svg"); const blob=new Blob(['<?xml version="1.0" encoding="UTF-8"?>\n'+svg.outerHTML],{type:"image/svg+xml"}); const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=n; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500); })); }
  if(location.hash){ const t=document.querySelector(location.hash); if(t) t.scrollIntoView(); }
}
async function tryPass(p,quiet){
  try{ $("content").innerHTML=await open(p); try{sessionStorage.setItem("st_brand",p);}catch(e){} show(); return true; }
  catch(e){ if(!quiet){ $("gerr").textContent="That passcode didn't work. Check it and try again."; $("pw").select(); } return false; }
}
if(!DATA){ show(); }
else {
  $("gf").addEventListener("submit",e=>{e.preventDefault(); $("gerr").textContent="Opening..."; tryPass($("pw").value,false);});
  let saved=null; try{saved=sessionStorage.getItem("st_brand");}catch(e){}
  if(saved) tryPass(saved,true); else $("pw").focus();
}
</script>
